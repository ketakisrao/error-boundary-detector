<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#f7f8fa"/><meta name="description" content="Frontend errors by page. Review component ownership and route errors to the right team."/><title>Faultline — Error tracking</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"/><script>
try {
  const saved = localStorage.getItem('faultline-theme');
  const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#14151a' : '#f7f8fa';
} catch {}
</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
